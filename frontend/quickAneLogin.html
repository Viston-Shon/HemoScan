<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HemoScan — Secure Access</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;700&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#E63329;--black:#0A0A0A;--white:#F5F4F0;
  --g1:#1A1A1A;--g2:#2E2E2E;--g3:#555;--g4:#888;--g5:#BBB;--g6:#DDD;--g7:#EBEBEB;
  --blue:#1446A0;--blue-dark:#0d3480;
  --sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--cond:'IBM Plex Sans Condensed',sans-serif;
}

/* ── VALID LICENCE KEYS (name → key) ─────────────────────────
   Add/remove entries here as needed.
   Format: "NAME": "LICENCE-KEY"
   Stored in JS below — not in CSS.
────────────────────────────────────────────────────────────── */

html,body{height:100%;font-family:var(--sans);background:var(--black);color:var(--white);overflow:hidden}

/* ── BG GRID PATTERN ───────────────────────────────────────── */
.bg-grid{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(230,51,41,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(230,51,41,.04) 1px,transparent 1px);
  background-size:48px 48px;
}
/* Vignette */
.bg-grid::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 40%,rgba(10,10,10,.85) 100%);
}

/* ── FLOATING CELL ANIMATIONS ──────────────────────────────── */
.bg-cells{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.cell-ring{
  position:absolute;border-radius:50%;border:1.5px solid;
  animation:float linear infinite;opacity:.18;
}
@keyframes float{
  0%  {transform:translateY(110vh) rotate(0deg);opacity:0}
  5%  {opacity:.18}
  95% {opacity:.18}
  100%{transform:translateY(-20vh) rotate(360deg);opacity:0}
}

/* ── MAIN LAYOUT ───────────────────────────────────────────── */
.page{
  position:relative;z-index:1;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
}

/* ── LOGO AREA ─────────────────────────────────────────────── */
.login-logo-wrap{
  display:flex;align-items:center;gap:16px;
  margin-bottom:40px;
  animation:logoIn .8s cubic-bezier(.22,1,.36,1) both;
}
@keyframes logoIn{
  from{opacity:0;transform:translateY(-30px) scale(.92)}
  to{opacity:1;transform:none}
}
.login-logo-img{
  height:64px;width:auto;
  filter:drop-shadow(0 0 18px rgba(230,51,41,.35));
  animation:logoPulse 3.5s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 14px rgba(230,51,41,.30))}
  50%    {filter:drop-shadow(0 0 28px rgba(230,51,41,.60))}
}
.login-brand-text{display:flex;flex-direction:column;gap:2px}
.login-brand-name{
  font-family:var(--cond);font-size:36px;font-weight:700;
  letter-spacing:.5px;line-height:1;
  background:linear-gradient(135deg,#fff 30%,#a8b8d8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.login-brand-name span{
  background:linear-gradient(135deg,var(--red) 0%,#ff6b5b 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.login-brand-sub{
  font-family:var(--mono);font-size:10px;letter-spacing:3px;
  text-transform:uppercase;color:var(--g4);
}

/* ── CARD ──────────────────────────────────────────────────── */
.login-card{
  width:100%;max-width:420px;
  background:rgba(26,26,26,.96);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 32px 80px rgba(0,0,0,.7),0 0 0 1px rgba(230,51,41,.06);
  animation:cardIn .9s cubic-bezier(.22,1,.36,1) .15s both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:none}
}
.card-header{
  padding:22px 28px 18px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-between;
}
.card-header-title{
  font-family:var(--mono);font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--g4);
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 8px #22c55e;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.card-body{padding:28px}

/* ── FORM FIELDS ───────────────────────────────────────────── */
.field{margin-bottom:20px}
.field label{
  display:block;font-family:var(--mono);font-size:9px;
  letter-spacing:2px;text-transform:uppercase;color:var(--g4);margin-bottom:7px;
}
.field-inner{position:relative}
.field-inner svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--g3);pointer-events:none;
  transition:color .2s;
}
.field input{
  width:100%;padding:11px 12px 11px 38px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);
  color:var(--white);font-family:var(--mono);font-size:13px;
  outline:none;transition:border-color .2s,background .2s,box-shadow .2s;
  -webkit-appearance:none;appearance:none;border-radius:0;
}
.field input::placeholder{color:var(--g3);font-size:11px;letter-spacing:.5px}
.field input:focus{
  border-color:var(--red);background:rgba(230,51,41,.04);
  box-shadow:0 0 0 3px rgba(230,51,41,.12);
}
.field input:focus + svg,.field-inner:focus-within svg{color:var(--red)}
/* Icon before input so SVG is sibling — flip order in HTML */
.field-inner{display:flex;flex-direction:row-reverse;align-items:center}
.field-inner svg{position:static;flex-shrink:0;margin-left:-27px;z-index:1;pointer-events:none}
.field-inner input{flex:1}

/* ── ERROR ─────────────────────────────────────────────────── */
.err-msg{
  display:none;margin-top:6px;
  font-family:var(--mono);font-size:10px;color:#f87171;
  letter-spacing:.5px;padding-left:2px;
}
.err-msg.show{display:block;animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── BTN ───────────────────────────────────────────────────── */
.login-btn{
  width:100%;padding:13px;margin-top:4px;
  background:var(--red);border:none;
  color:#fff;font-family:var(--cond);font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  position:relative;overflow:hidden;transition:background .2s,transform .1s;
}
.login-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent);
  opacity:0;transition:opacity .2s;
}
.login-btn:hover{background:#c8281f;transform:translateY(-1px)}
.login-btn:hover::before{opacity:1}
.login-btn:active{transform:translateY(0)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Loading spinner in button */
.btn-spinner{
  display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
  margin:0 auto;
}
@keyframes sp{to{transform:rotate(360deg)}}
.login-btn.loading .btn-txt{display:none}
.login-btn.loading .btn-spinner{display:block}

/* ── CARD FOOTER ───────────────────────────────────────────── */
.card-footer{
  padding:14px 28px;border-top:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;gap:8px;
}
.card-footer-icon{
  width:14px;height:14px;color:var(--g3);flex-shrink:0;
}
.card-footer p{font-family:var(--mono);font-size:9px;color:var(--g3);letter-spacing:.5px;line-height:1.5}

/* ── SCAN LINE ANIMATION ON CARD ───────────────────────────── */
.login-card{position:relative;overflow:hidden}
.scan-line{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(230,51,41,.4),transparent);
  animation:scan 3.5s ease-in-out infinite;top:-2px;
}
@keyframes scan{
  0%{top:-2px}
  100%{top:102%}
}

/* ── SUCCESS OVERLAY ───────────────────────────────────────── */
.success-overlay{
  position:fixed;inset:0;z-index:999;
  background:var(--black);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.success-overlay.show{opacity:1;pointer-events:all}
.success-icon{
  width:60px;height:60px;border-radius:50%;border:2px solid #22c55e;
  display:flex;align-items:center;justify-content:center;
  animation:scaleIn .4s cubic-bezier(.22,1,.36,1);
}
@keyframes scaleIn{from{transform:scale(0)}to{transform:scale(1)}}
.success-icon svg{width:28px;height:28px;color:#22c55e}
.success-text{font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.5px;color:#fff}
.success-sub{font-family:var(--mono);font-size:11px;color:var(--g4);letter-spacing:1px}
.success-bar{
  width:220px;height:2px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden;
}
.success-bar-fill{
  height:100%;width:0;background:var(--red);
  transition:width 1.2s linear;
}
</style>
</head>

</div><!-- end .page -->

<script>
// ════════════════════════════════════════════════════════════
// VALID LICENCE KEYS
// Format: { "LICENCE-KEY": "Allowed Name (optional)" }
// If name value is "", any name is accepted for that key.
// If name value is non-empty, it must match (case-insensitive).
// ════════════════════════════════════════════════════════════
const LICENCES = {
  "HEMO001": "",        // any name
  "HEMO-2024-BETA-002":  "",        // any name
  "HSC-LAB-0001-XRAY":  "Dr. Smith",
  "HSC-LAB-0002-BETA":  "Dr. Patel",
  "HSC-LAB-0003-DEMO":  "",
  "DEMO-KEY-1234-5678":  "",        // demo/testing key
};

// ── FLOATING CELLS BACKGROUND ──────────────────────────────
(function(){
  const wrap = document.getElementById('bgCells');
  const colors = ['rgba(230,51,41,1)','rgba(20,70,160,1)','rgba(255,255,255,1)'];
  const n = 22;
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'cell-ring';
    const sz = 28 + Math.random()*90;
    const col = colors[Math.floor(Math.random()*colors.length)];
    const dur = 14 + Math.random()*20;
    const delay = -Math.random()*dur;
    const left = Math.random()*100;
    el.style.cssText = `
      width:${sz}px;height:${sz}px;
      border-color:${col};
      left:${left}%;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    // Add inner pallor ring (biconcave disc visual)
    if(Math.random()>.5){
      const inner = document.createElement('div');
      inner.style.cssText = `
        position:absolute;inset:22%;border-radius:50%;
        border:1px solid ${col};opacity:.5;
      `;
      el.appendChild(inner);
    }
    wrap.appendChild(el);
  }
})();

// ── LOGIN LOGIC ─────────────────────────────────────────────
function doLogin(){
  const nameEl = document.getElementById('loginName');
  const keyEl  = document.getElementById('loginKey');
  const nameErr= document.getElementById('nameErr');
  const keyErr = document.getElementById('keyErr');
  const btn    = document.getElementById('loginBtn');

  // Reset errors
  nameErr.classList.remove('show');
  keyErr.classList.remove('show');

  const name = nameEl.value.trim();
  const key  = keyEl.value.trim().toUpperCase();

  // Validate name
  if(!name){
    nameErr.classList.add('show');
    nameEl.focus();
    return;
  }

  // Validate key exists
  if(!LICENCES.hasOwnProperty(key)){
    keyErr.textContent = 'Invalid licence key — contact your administrator';
    keyErr.classList.add('show');
    keyEl.focus();
    return;
  }

  // Validate name for key (if key has name restriction)
  const allowedName = LICENCES[key];
  if(allowedName && allowedName.toLowerCase() !== name.toLowerCase()){
    nameErr.textContent = 'Name does not match the registered licence holder';
    nameErr.classList.add('show');
    nameEl.focus();
    return;
  }

  // ── ALL VALID — show loading state then redirect ──────────
  btn.classList.add('loading');
  btn.disabled = true;

  // Store name for use on the main app page
  sessionStorage.setItem('hs_user', name);
  sessionStorage.setItem('hs_key',  key);

  // Show success overlay
  setTimeout(() => {
    const overlay = document.getElementById('successOverlay');
    const msg     = document.getElementById('successMsg');
    const bar     = document.getElementById('successBarFill');
    msg.textContent = `Welcome, ${name}`;
    overlay.classList.add('show');
    // Trigger progress bar
    setTimeout(() => { bar.style.width = '100%'; }, 50);
    // Redirect after bar completes
    setTimeout(() => {
      window.location.href = 'quickAneFrontend.html';
    }, 1400);
  }, 700);
}

// Allow pressing Enter to submit
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
